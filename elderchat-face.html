<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ELDERCHAT 表情 Demo</title>
<style>
  :root{
    --cream:#f3ecdd; --wood1:#8a5b38; --wood2:#6f4527; --ink:#161614;
    --lime:#cbf24c; --screen:#faf6ec; --brass:#c9a227;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:radial-gradient(circle at 50% 0%,#f7f4ea,#e7e2d5 70%);
       font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:var(--ink);
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 14px 30px}

  /* ---------- 裝置 ---------- */
  .device{width:min(92vw,360px);position:relative;margin-top:6px}
  .body{background:linear-gradient(180deg,#fbf7ee,#efe7d6);border-radius:22px;
        box-shadow:0 18px 40px rgba(40,35,25,.18),inset 0 1px 0 #fff;
        padding:12px;display:flex;gap:9px}
  .wood{width:12px;border-radius:7px;background:
        repeating-linear-gradient(180deg,var(--wood1) 0 7px,var(--wood2) 7px 9px,var(--wood1) 9px 15px);
        box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .front{flex:1;display:flex;flex-direction:column;gap:9px}

  /* 鏡頭 */
  .camrow{display:flex;align-items:center;justify-content:center;gap:7px;height:16px}
  .lens{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5b6470,#0a0d12 70%);
        border:2px solid var(--brass);box-shadow:0 0 0 1px rgba(0,0,0,.15)}
  .led{width:5px;height:5px;border-radius:50%;background:#69d98f;box-shadow:0 0 7px #69d98f}

  /* 螢幕 */
  .screen{position:relative;background:var(--screen);border-radius:12px;overflow:hidden;
          border:2px solid #24231f;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
          transition:background .35s}
  .screen.night{background:#1a1c19}
  .clock{position:absolute;left:12px;top:8px;font-size:clamp(30px,10vw,44px);font-weight:800;letter-spacing:-1px;
         opacity:0;transition:opacity .4s}
  .clock small{display:block;font-size:13px;font-weight:500;color:#7b7f74;letter-spacing:0}
  .clock.show{opacity:1}

  .face{position:relative;width:64%;height:52%;transition:opacity .35s;opacity:0}
  .face.show{opacity:1}
  .eye{position:absolute;top:10%;width:26%;height:34%;background:#20211e;border-radius:50%;
       transition:height .55s cubic-bezier(.34,1.3,.5,1),top .55s,border-radius .55s,background .3s}
  .eye.l{left:12%} .eye.r{right:12%}
  .pupil{position:absolute;left:22%;top:18%;width:30%;height:30%;background:#fff;border-radius:50%;opacity:.9}
  /* 待機：瞇眼 */
  .face.idle .eye{height:6%;top:42%;border-radius:6px}
  .face.idle .pupil{opacity:0}
  /* 聆聽：放大＋眨眼 */
  .face.listen .eye{height:38%;top:4%}
  /* 開心：彎眼 */
  .face.happy .eye{height:0;border-radius:0;background:transparent;
       box-shadow:none;border-top:6px solid #20211e;border-radius:50% 50% 0 0}
  .face.happy .eye{height:26%;top:6%;background:transparent;border:0;border-top:7px solid #20211e;border-radius:50% 50% 0 0}
  .face.happy .pupil{opacity:0}
  .mouth{position:absolute;left:50%;transform:translateX(-50%);bottom:6%;width:30%;height:8%;
         background:#20211e;border-radius:0 0 40px 40px;transition:height .12s,width .2s,border-radius .2s}
  .face.idle .mouth{height:4%;width:22%;border-radius:40px}
  .face.happy .mouth{height:14%;width:34%;border-radius:0 0 40px 40px;background:#20211e}
  .face.talk .mouth{height:20%}

  /* 語音文字 */
  .caption{position:absolute;left:10px;right:10px;bottom:8px;font-size:13px;font-weight:600;
           color:#20211e;opacity:0;transition:opacity .3s;line-height:1.35}
  .caption.show{opacity:1}
  .caption b{background:linear-gradient(transparent 60%,var(--lime) 60%)}

  /* VU 光條 */
  .vu{display:flex;align-items:flex-end;gap:3px;height:22px;padding:0 4px}
  .vu i{flex:1;background:#d9d2c0;border-radius:2px;height:4px;transition:height .08s linear,background .2s}

  /* 織布喇叭 */
  .grille{height:64px;border-radius:10px;
    background:
      radial-gradient(circle at 4px 4px,#b7ab92 1.6px,transparent 1.8px) 0 0/8px 8px,
      radial-gradient(circle at 4px 4px,#c9bda4 1.6px,transparent 1.8px) 4px 4px/8px 8px,
      #cfc3ab;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}

  /* 旋鈕 */
  .knobs{display:flex;justify-content:space-between;align-items:center;padding:0 6px 2px}
  .knob{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e2c65a,var(--brass));
        box-shadow:0 2px 4px rgba(0,0,0,.25),inset 0 -2px 3px rgba(0,0,0,.25)}
  .knob.dark{background:radial-gradient(circle at 35% 30%,#4a4a44,#191917);width:20px;height:20px}
  .dotline{flex:1;display:flex;justify-content:center;gap:4px}
  .dotline i{width:3px;height:3px;border-radius:50%;background:#5f5b50;opacity:.5}

  /* 底座 */
  .base{height:12px;margin:0 6px;border-radius:0 0 12px 12px;
        background:linear-gradient(180deg,#e6decb,#cfc5ae);box-shadow:0 8px 16px rgba(40,35,25,.18)}

  /* 控制列 */
  .pad{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px;width:min(92vw,420px)}
  button{border:1px solid #d5cfbf;background:#fff;color:var(--ink);border-radius:999px;
         padding:11px 16px;font-size:15px;font-weight:700;font-family:inherit;
         box-shadow:0 4px 10px rgba(40,35,25,.08);cursor:pointer}
  button.on{background:var(--lime);border-color:#b6dd33}
  button.say{background:var(--ink);color:var(--lime);border-color:var(--ink)}
  .hint{margin-top:14px;font-size:12.5px;color:#7b7f74;text-align:center;line-height:1.6;max-width:420px}
</style>
</head>
<body>

<div class="device">
  <div class="body">
    <div class="wood"></div>
    <div class="front">
      <div class="camrow"><span class="led"></span><span class="lens"></span></div>
      <div class="screen" id="screen">
        <div class="clock show" id="clock">08:42<small>星期三・10月21日</small></div>
        <div class="face idle show" id="face">
          <div class="eye l"><span class="pupil"></span></div>
          <div class="eye r"><span class="pupil"></span></div>
          <div class="mouth"></div>
        </div>
        <div class="caption" id="caption"></div>
      </div>
      <div class="vu" id="vu"></div>
      <div class="grille"></div>
      <div class="knobs">
        <div class="knob"></div>
        <div class="dotline"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="knob dark"></div>
      </div>
    </div>
    <div class="wood"></div>
  </div>
  <div class="base"></div>
</div>

<div class="pad">
  <button onclick="setState('idle')" id="b-idle" class="on">① 待機</button>
  <button onclick="setState('listen')" id="b-listen">② 聆聽</button>
  <button onclick="setState('talk')" id="b-talk">③ 說話</button>
  <button onclick="setState('happy')" id="b-happy">④ 開心</button>
  <button class="say" onclick="speak()">🔊 用語音說話</button>
</div>

<p class="hint">按「用語音說話」會真的唸出來（用裝置的中文語音），嘴巴與光條跟著聲音跳動。<br>螢幕 10 秒沒互動會自動回到時鐘。</p>

<script>
const face = document.getElementById('face');
const clock = document.getElementById('clock');
const caption = document.getElementById('caption');
const screenEl = document.getElementById('screen');
const vu = document.getElementById('vu');

// VU 24 段
const SEG = 24;
for (let i = 0; i < SEG; i++) vu.appendChild(document.createElement('i'));
const segs = [...vu.children];

let state = 'idle';
let idleTimer = null;
let raf = null;
let level = 0;      // 0..1 目前音量
let speaking = false;

function paintVu(v){
  segs.forEach((s, i) => {
    const on = (i / SEG) < v;
    s.style.height = (4 + on * 18) + 'px';
    s.style.background = on ? (i / SEG > 0.75 ? '#cbf24c' : '#8fbf3f') : '#d9d2c0';
  });
}

function loop(){
  const t = performance.now();
  // 說話中＝有語音就跟語音；沒有語音（demo）就自己跑一個語速波形
  const fakeTalk = (state === 'talk' && !speaking) ? (0.32 + 0.58 * Math.abs(Math.sin(t / 170))) : 0;
  const target = speaking ? (0.35 + Math.random() * 0.62)
               : (fakeTalk || (state === 'listen' ? 0.22 : 0));
  level = level * 0.72 + target * 0.28;
  paintVu(level);
  // 說話時嘴巴跟著音量
  if (state === 'talk' || speaking){
    face.classList.add('talk');
    const mouth = face.querySelector('.mouth');
    mouth.style.height = (12 + level * 26) + '%';
    mouth.style.width = (26 + level * 10) + '%';
  }
  raf = requestAnimationFrame(loop);
}
loop();

function setState(s, opts = {}){
  state = s;
  face.className = 'face show ' + s;
  ['idle','listen','talk','happy'].forEach(k =>
    document.getElementById('b-' + k).classList.toggle('on', k === s));

  clock.classList.toggle('show', s === 'idle');
  caption.classList.toggle('show', s === 'talk');
  screenEl.classList.toggle('night', false);

  if (!document.querySelector('#' + 'face')) return;

  if (s === 'talk' && !opts.keepCaption){
    caption.innerHTML = '<b>阿公</b>，今天去菜市場遇到誰？';
  }
  if (s === 'happy') caption.innerHTML = '孫子數學考 <b>100 分</b>！', caption.classList.add('show');
  if (s !== 'happy' && s !== 'talk') caption.classList.remove('show');

  clearTimeout(idleTimer);
  if (s !== 'idle' && !speaking){
    idleTimer = setTimeout(() => setState('idle'), 10000);
  }
}

// 真的唸出來（Web Speech API）
function speak(){
  setState('talk');
  caption.classList.add('show');
  caption.innerHTML = '<b>阿公</b>，今天下晡會下雨，出門記得帶傘。你欲聽文夏的歌無？';
  const text = '阿公，今天下午會下雨，出門記得帶傘。你要聽文夏的歌嗎？';

  if (!('speechSynthesis' in window)){
    // 沒有語音：用模擬波形跑 4 秒
    speaking = true;
    setTimeout(() => { speaking = false; setState('idle'); }, 4000);
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  u.rate = 0.92;
  u.pitch = 1.0;
  const vs = speechSynthesis.getVoices().filter(v => /zh[-_]TW|Chinese \(Taiwan\)|國語|中文/i.test(v.lang + v.name));
  if (vs.length) u.voice = vs[0];

  u.onstart = () => { speaking = true; };
  u.onboundary = () => { level = Math.min(1, level + 0.35); };
  u.onend = () => { speaking = false; setTimeout(() => setState('idle'), 1200); };
  u.onerror = () => { speaking = false; };
  speechSynthesis.speak(u);
}

// 初始化：載入語音清單（部分瀏覽器要等 voiceschanged）
if ('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = () => {};
  speechSynthesis.getVoices();
}
setState('idle');
</script>
</body>
</html>
