<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Basenefit 棒球加重環 Ø55 × 172mm</title>
<style>
  :root{--ink:#1d2530;--dim:#5b6878;--line:#dfe5ec;--accent:#1f4e79;--bg:#f6f8fa}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);background:var(--bg)}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  .panel{position:fixed;left:16px;top:16px;background:rgba(255,255,255,.94);border:1px solid var(--line);
         border-radius:14px;padding:14px 16px;max-width:280px;box-shadow:0 6px 24px rgba(20,30,45,.08)}
  .panel h1{margin:0 0 2px;font-size:16px;letter-spacing:.02em}
  .panel .sub{font-size:12px;color:var(--dim);margin-bottom:10px}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;
         padding:7px 11px;font-size:12.5px;cursor:pointer}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  td{padding:3px 0;color:var(--dim)}
  td:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
  .hint{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.5}
  #legend{position:fixed;right:16px;bottom:16px;background:rgba(255,255,255,.94);border:1px solid var(--line);
          border-radius:12px;padding:10px 13px;font-size:12px;color:var(--dim);line-height:1.7}
  #legend b{color:var(--ink)}
  .panel.fold table,.panel.fold .hint,.panel.fold .sub{display:none}
  @media (max-width:560px){
    .panel{left:10px;right:10px;top:auto;bottom:74px;max-width:none;padding:10px 12px;border-radius:12px}
    #legend{right:10px;left:10px;bottom:10px;font-size:11px;padding:8px 11px}
    .panel h1{font-size:14.5px;margin-bottom:6px}
    .panel .sub{font-size:11px;margin-bottom:6px}
    .row{margin-bottom:6px}
    button{padding:6px 9px;font-size:12px}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div class="panel">
  <h1>Basenefit 加重環</h1>
  <div class="sub">Ø55 × H172mm｜對開夾緊版 v8</div>
  <div class="row">
    <button id="bAsm" class="on">合體</button>
    <button id="bExp">剖開</button>
    <button id="bHalf">單半件</button>
  </div>
  <div class="row">
    <button id="bWire">線框</button>
    <button id="bSpin" class="on">自動旋轉</button>
    <button id="bMore">規格 ▾</button>
  </div>
  <table>
    <tr><td>外徑 / 總長</td><td>Ø55 / 172mm</td></tr>
    <tr><td>穿孔</td><td>Ø28</td></tr>
    <tr><td>水艙容積</td><td>134.6 cm³</td></tr>
    <tr><td>注水後重量</td><td>約 235 g</td></tr>
    <tr><td>填鐵砂</td><td>約 510 g</td></tr>
  </table>
  <div class="hint">拖曳旋轉、雙指縮放。兩半完全相同，印兩份，4 支 M3 螺絲夾緊。</div>
</div>

<div id="legend">
  <b>水艙</b> 環形腔體，注水約 125 g<br>
  <b>浮雕</b> b 標記 + BASENEFIT（沿長軸）
</div>

function parseSTL(b64){
  const bin = atob(b64);
  const buf = new ArrayBuffer(bin.length);
  const u8 = new Uint8Array(buf);
  for (let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const dv = new DataView(buf);
  const n = dv.getUint32(80, true);
  const pos = new Float32Array(n*9);
  let o = 84;
  for (let i=0;i<n;i++){
    o += 12; // normal
    for (let v=0; v<3; v++){
      pos[i*9+v*3+0] = dv.getFloat32(o, true);
      pos[i*9+v*3+1] = dv.getFloat32(o+4, true);
      pos[i*9+v*3+2] = dv.getFloat32(o+8, true);
      o += 12;
    }
    o += 2;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  g.computeBoundingBox();
  return g;
}

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f8fa);

const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 1, 4000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

scene.add(new THREE.AmbientLight(0xffffff, 0.72));
const k = new THREE.DirectionalLight(0xffffff, 0.85); k.position.set(160, 220, 200); scene.add(k);
const f = new THREE.DirectionalLight(0xdfe9f5, 0.45); f.position.set(-180, -60, 120); scene.add(f);
const r = new THREE.DirectionalLight(0xffffff, 0.35); r.position.set(-120, 180, -160); scene.add(r);

const geo = parseSTL(STL_B64);
const mat = new THREE.MeshStandardMaterial({color:0xc9d2dc, metalness:0.12, roughness:0.52});
const matB = new THREE.MeshStandardMaterial({color:0xb9c4d1, metalness:0.12, roughness:0.55});

const group = new THREE.Group();
const halfA = new THREE.Mesh(geo, mat);
const halfB = new THREE.Mesh(geo, matB);
halfB.scale.y = -1;
halfA.material.side = THREE.DoubleSide;
halfB.material.side = THREE.DoubleSide;
group.add(halfA, halfB);

// 讓軸向（STL 的 Z）變成豎直：繞 X 轉 -90°，模型中心移到原點
group.rotation.x = -Math.PI/2;
const bb = geo.boundingBox, c = new THREE.Vector3();
bb.getCenter(c);
// 兩個半件的幾何相同：先都平移到原點，B 再以 Y 鏡射 → 合起來是完整一件
halfA.position.set(-c.x, -c.y, -c.z);
halfB.position.set(-c.x,  c.y, -c.z);   // B 先以 Y 鏡射，再平移回同一中心
scene.add(group);

let mode = 'asm';
function layout(){
  const gap = mode === 'exp' ? 30 : 0;   // 沿分割面法線（模型 Y）拉開
  halfA.position.set(-c.x, -c.y + gap, -c.z);
  halfB.position.set(-c.x,  c.y - gap, -c.z);
  halfA.visible = mode !== 'half';
  halfB.visible = mode !== 'half';
  frame();
}

function frame(){
  const h = 172, w = 60 + (mode==='exp'? 70 : 0);
  const dist = Math.max(h, w) * (innerWidth < 560 ? 2.05 : 1.55);
  camera.position.set(dist*0.62, dist*0.5, dist*0.85);
  // 手機：面板在下方 → 視角目標上移，讓模型落在上半部
  controls.target.set(0, innerWidth < 560 ? 40 : 0, 0);
  controls.update();
}
frame();

const narrow = innerWidth < 560;
const panel = document.querySelector('.panel');
if (narrow) panel.classList.add('fold');
document.getElementById('bMore').onclick = (e) => {
  panel.classList.toggle('fold');
  e.target.textContent = panel.classList.contains('fold') ? '規格 ▾' : '規格 ▴';
};
if (!narrow) document.getElementById('bMore').style.display = 'none';

let spin = true;
const el = {asm:document.getElementById('bAsm'), exp:document.getElementById('bExp'),
            half:document.getElementById('bHalf'), wire:document.getElementById('bWire'),
            spin:document.getElementById('bSpin')};
function setMode(m){
  mode = m;
  ['asm','exp','half'].forEach(k2 => el[k2].classList.toggle('on', k2===m));
  layout();
}
el.asm.onclick = ()=>setMode('asm');
el.exp.onclick = ()=>setMode('exp');
el.half.onclick = ()=>setMode('half');
el.wire.onclick = ()=>{
  const on = !el.wire.classList.contains('on');
  el.wire.classList.toggle('on', on);
  mat.wireframe = on; matB.wireframe = on;
};
el.spin.onclick = ()=>{ spin = !spin; el.spin.classList.toggle('on', spin); };

// 給外部截圖／測試用
window.__bw = {scene, camera, renderer, controls, setMode, get mode(){return mode;},
               ready:true, size(){ const b=new THREE.Box3().setFromObject(group); const s=new THREE.Vector3(); b.getSize(s); return s.toArray(); }};

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let t0 = performance.now();
function tick(now){
  const dt = now - t0; t0 = now;
  if (spin) group.rotation.z += dt * 0.00022;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
