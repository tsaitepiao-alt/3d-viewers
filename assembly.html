<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>智慧頸環 · 全套件配色</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#d9e0ea;color:#1a1f2b;font-family:-apple-system,"PingFang TC",sans-serif;overflow:hidden}
#c{position:fixed;inset:0}
#hud{position:fixed;top:14px;left:14px;background:rgba(255,255,255,.97);border:1px solid #c3ccda;
 border-radius:14px;padding:14px 16px;max-width:330px;box-shadow:0 6px 24px rgba(40,55,80,.16)}
h1{font-size:16px;margin-bottom:3px}.sub{font-size:11px;color:#5a6478;margin-bottom:11px}
.grp{margin-bottom:10px}.grp>span{font-size:12px;font-weight:600;display:block;margin-bottom:5px}
.grp>span b{color:#2b62d9}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw i{width:24px;height:24px;border-radius:6px;border:2px solid #b9c3d3;cursor:pointer;display:block}
.sw i.on{border-color:#2b62d9;transform:scale(1.16)}
button{background:#eef1f6;color:#1a1f2b;border:1px solid #c3ccda;border-radius:8px;
 padding:6px 11px;font-size:12px;cursor:pointer;margin:0 5px 5px 0}
button:hover{background:#e2e8f2}
#dims{position:fixed;top:14px;right:14px;background:rgba(255,255,255,.97);border:1px solid #c3ccda;
 border-radius:14px;padding:13px 15px;font-size:11.5px;min-width:250px;box-shadow:0 6px 24px rgba(40,55,80,.16)}
#dims div{display:flex;justify-content:space-between;gap:14px;padding:2.5px 0;border-bottom:1px solid #e2e8f2}
#dims div:last-child{border:0}#dims b{color:#2b62d9;font-weight:600}
#tip{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:11.5px;color:#5a6478;
 background:rgba(255,255,255,.92);padding:7px 15px;border-radius:9px;border:1px solid #d3dae6}
#infoBtn,#menuBtn{position:fixed;bottom:16px;background:#fff;color:#1a1f2b;border:1px solid #c3ccda;
 border-radius:999px;padding:9px 16px;font-size:13px;cursor:pointer;display:none;z-index:30;
 box-shadow:0 4px 16px rgba(0,0,0,.18)}
#infoBtn{right:16px}#menuBtn{left:16px}
#mtitle{display:none}
@media (max-width:900px){
  #hud{display:none;top:auto;bottom:70px;left:10px;right:10px;max-width:100%;max-height:58vh;overflow-y:auto}
  #hud.show{display:block}
  #dims{display:none;top:auto;bottom:70px;left:10px;right:10px;min-width:0;max-height:58vh;overflow-y:auto}
  #dims.show{display:block}
  #infoBtn,#menuBtn{display:block}
  #tip{display:none}
  #mtitle{display:block;position:fixed;top:0;left:0;right:0;height:30px;line-height:30px;text-align:center;
    font-size:12px;color:#3a4356;background:rgba(255,255,255,.92);border-bottom:1px solid #d3dae6;
    z-index:25;pointer-events:none}
}

new THREE.GLTFLoader().parse(bin.buffer,'',g=>{
  const root=g.scene;sc.add(root);
  root.traverse(o=>{if(o.isMesh){
     if(o.geometry.attributes&&o.geometry.attributes.color)o.geometry.deleteAttribute('color');
     o.geometry.computeVertexNormals();
     const nm=(o.name||'').toUpperCase();
     let grp=null; for(const g in GROUPS) if(GROUPS[g].some(p=>nm.indexOf(p)>=0)) grp=g;
     o.userData.grp=grp;
     o.material=mkMat(grp?state[grp]:'#FFFFFF');
     meshes.push(o);
     const eg=new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry,22),
        new THREE.LineBasicMaterial({color:0x2a3a52,transparent:true,opacity:.85}));
     eg.visible=false; o.add(eg); edgeObjs.push(eg);
  }});
  const box=new THREE.Box3().setFromObject(root),sz=new THREE.Vector3(),c0=new THREE.Vector3();
  box.getSize(sz);box.getCenter(c0);root.position.sub(c0);
  const d=Math.max(sz.x,sz.y,sz.z)*1.35;
  cam.position.set(d*.62,-d*.78,d*.58);oc.target.set(0,0,0);oc.update();
  buildUI();
});
function buildUI(){
  const host=document.getElementById('grps');host.innerHTML='';
  Object.keys(GROUPS).forEach(g=>{
    const w=document.createElement('div');w.className='grp';
    w.innerHTML=`<span>${g}：<b style="color:${state[g]}">${state[g]}</b></span>`;
    const sw=document.createElement('div');sw.className='sw';
    PALETTE.forEach(c=>{const e=document.createElement('i');e.dataset.c=c;e.style.background=c;
      if(c===state[g])e.classList.add('on');
      e.onclick=()=>{state[g]=c;
        w.querySelector('b').textContent=c;w.querySelector('b').style.color=c;
        sw.querySelectorAll('i').forEach(x=>x.classList.toggle('on',x.dataset.c===c));
        applyColors();};
      sw.appendChild(e);});
    w.appendChild(sw);host.appendChild(w);
  });
}
document.getElementById('bWire').onclick=e=>{
  mode=(mode+1)%3;
  meshes.forEach((m,i)=>{m.material.dispose();
    m.material=mkMat(m.userData.grp?state[m.userData.grp]:'#FFFFFF');
    m.material.wireframe=(mode===1);});
  edgeObjs.forEach(l=>{l.visible=(mode===2);});
  e.target.textContent='顯示：'+MODE_NAME[mode];};
document.getElementById('bSpin').onclick=()=>{spin=!spin;};
document.getElementById('bReset').onclick=()=>{sc.rotation.set(0,0,0);cam.position.set(120,-150,110);oc.target.set(0,0,0);};
const _hide=id=>['hud','dims'].forEach(k=>{if(k!==id)document.getElementById(k).classList.remove('show');});
document.getElementById('infoBtn').onclick=e=>{e.stopPropagation();const d=document.getElementById('dims');
  d.classList.toggle('show');if(d.classList.contains('show'))_hide('dims');};
document.getElementById('menuBtn').onclick=e=>{e.stopPropagation();const h=document.getElementById('hud');
  h.classList.toggle('show');if(h.classList.contains('show'))_hide('hud');};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rn.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);if(spin)sc.rotation.y+=.006;oc.update();rn.render(sc,cam);})();
</script></body></html>
