const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
new THREE.GLTFLoader().parse(bin.buffer,'',g=>{
  const root=g.scene;sc.add(root);
  root.traverse(o=>{if(o.isMesh){
     // ★ GLB 帶了頂點色（COLOR_0）會蓋掉材質色 → 必須移除，否則不管選什麼色都是黑的
     if(o.geometry){
       if(o.geometry.attributes&&o.geometry.attributes.color)o.geometry.deleteAttribute('color');
       o.geometry.computeVertexNormals();   // ★ 布林後法線常損壞/內翻 → 重算，否則整片變黑
     }
     // ★ 用 Lambert 不用 Standard：Standard 的 PBR+環境貼圖在缺 IBL 時容易全黑
     o.material=new THREE.MeshLambertMaterial({color:0xffffff,side:THREE.DoubleSide});
     meshes.push(o);
     // ★ 特徵邊：只取夾角 >22° 的邊（轉角/輪廓），跳過平坦處的三角形邊 → 乾淨好讀
     const eg=new THREE.LineSegments(
        new THREE.EdgesGeometry(o.geometry, 22),
        new THREE.LineBasicMaterial({color:0x2a3a52, transparent:true, opacity:.85}));
     eg.visible=false; eg.userData.kind='edge'; o.add(eg); edgeObjs.push(eg);}});
  const box=new THREE.Box3().setFromObject(root),sz=new THREE.Vector3();box.getSize(sz);
  const c=new THREE.Vector3();box.getCenter(c);
  root.position.sub(new THREE.Vector3(c.x,c.y,c.z));
  const d=Math.max(sz.x,sz.y)*1.5;cam.position.set(d*.62,-d*.78,d*.58);oc.target.set(0,0,0);
  oc.update();
  meshes.forEach((m,i)=>{m.userData.y0=m.position.y;m.userData.idx=i;});
  setColor('#FFFFFF');
});
let curHex='#FFFFFF', flat=false;
function mkMat(h){return flat
  ? new THREE.MeshBasicMaterial({color:h,side:THREE.DoubleSide})          // 純色：不靠光影，保證看得到
  : new THREE.MeshLambertMaterial({color:h,side:THREE.DoubleSide});}      // 立體：有明暗
function setColor(hex){curHex=hex;meshes.forEach(m=>m.material.color.set(hex));
  document.querySelectorAll('.sw i').forEach(e=>e.classList.toggle('on',e.dataset.c===hex));}
function rebuild(){meshes.forEach(m=>{m.material.dispose();m.material=mkMat(curHex);});}
const sw=document.getElementById('sw');
COLORS.forEach(c=>{const e=document.createElement('i');e.dataset.c=c;e.style.background=c;
  e.onclick=()=>setColor(c);sw.appendChild(e);});
setColor('#FFFFFF');
document.getElementById('bSp').onclick=()=>{
  const on=meshes.length&&Math.abs(meshes[0].position.y-(meshes[0].userData.y0||0))<1;
  meshes.forEach(m=>m.position.y=(m.userData.y0||0)+(on?(m.userData.idx===0?11:-11):0));
  meshes.forEach(m=>{if(Math.abs(m.userData.y0)<1e-6)m.position.y=(m.userData.idx===0?11:-11);});};
document.getElementById('bWire').onclick=e=>{
  mode=(mode+1)%3;                                   // 0實體 1全線框 2特徵邊
  meshes.forEach(m=>{m.material.wireframe=(mode===1);});
  edgeObjs.forEach(l=>{l.visible=(mode===2);});
  e.target.textContent='顯示：'+MODE_NAME[mode];};
document.getElementById('bSpin').onclick=()=>{spin=!spin;};
document.getElementById('bFlat').onclick=e=>{flat=!flat;rebuild();
  e.target.textContent=flat?'🌗 立體模式':'🔆 純色模式';};
document.getElementById('bReset').onclick=()=>{cam.position.set(78,-96,72);oc.target.set(0,0,0);};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  rn.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);
 if(spin){sc.rotation.y+=.006;}oc.update();rn.render(sc,cam);})();
</script></body></html>
